name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies (puppeteer-core)
        run: npm ci

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chrome's sandbox needs.
      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run headless browser tests
        run: node run-tests.js

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/report/
          if-no-files-found: ignore
